<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg class="branch-decoration" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
    <path d="M140 10 Q100 20 80 50 Q60 80 30 90" stroke="#5a4632" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M100 30 Q90 25 85 15" stroke="#5a4632" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M70 60 Q60 55 55 45" stroke="#5a4632" stroke-width="2" fill="none" stroke-linecap="round"/>

    <g transform="translate(85,15)">
        <circle cx="0" cy="-6" r="6" fill="#f4b8c1"/>
        <circle cx="6" cy="-2" r="6" fill="#f4b8c1"/>
        <circle cx="4" cy="5" r="6" fill="#f4b8c1"/>
        <circle cx="-4" cy="5" r="6" fill="#f4b8c1"/>
        <circle cx="-6" cy="-2" r="6" fill="#f4b8c1"/>
        <circle cx="0" cy="0" r="3" fill="#e8909f"/>
    </g>

    <g transform="translate(55,45)">
        <circle cx="0" cy="-5" r="5" fill="#f7c8cf"/>
        <circle cx="5" cy="-2" r="5" fill="#f7c8cf"/>
        <circle cx="3" cy="4" r="5" fill="#f7c8cf"/>
        <circle cx="-3" cy="4" r="5" fill="#f7c8cf"/>
        <circle cx="-5" cy="-2" r="5" fill="#f7c8cf"/>
        <circle cx="0" cy="0" r="2.5" fill="#e8909f"/>
    </g>

    <g transform="translate(30,90)">
        <circle cx="0" cy="-5" r="5" fill="#f4b8c1"/>
        <circle cx="5" cy="-2" r="5" fill="#f4b8c1"/>
        <circle cx="3" cy="4" r="5" fill="#f4b8c1"/>
        <circle cx="-3" cy="4" r="5" fill="#f4b8c1"/>
        <circle cx="-5" cy="-2" r="5" fill="#f4b8c1"/>
        <circle cx="0" cy="0" r="2.5" fill="#e8909f"/>
    </g>

    <g transform="translate(120,25)">
        <circle cx="0" cy="-4" r="4" fill="#f7c8cf"/>
        <circle cx="4" cy="-1" r="4" fill="#f7c8cf"/>
        <circle cx="2" cy="3" r="4" fill="#f7c8cf"/>
        <circle cx="-2" cy="3" r="4" fill="#f7c8cf"/>
        <circle cx="-4" cy="-1" r="4" fill="#f7c8cf"/>
    </g>
</svg>

<div class="container center-page">

    <div style="text-align: center; margin-bottom: 8px;">
        <svg width="50" height="45" viewBox="0 0 50 45" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="10" width="42" height="4" fill="#bc002d"/>
            <rect x="0" y="16" width="50" height="3" fill="#bc002d"/>
            <rect x="8" y="13" width="4" height="30" fill="#bc002d"/>
            <rect x="38" y="13" width="4" height="30" fill="#bc002d"/>
            <rect x="20" y="19" width="10" height="3" fill="#8a1f1f"/>
        </svg>
    </div>

    <div class="page-title" id="form-title" style="text-align: center;">Login</div>

    <div class="error-message" id="error-box" style="display: none;"></div>

    <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" required>

        <button type="submit">Login</button>
    </form>

    <form id="register-form" style="display: none;">
        <label for="register-name">Name</label>
        <input type="text" id="register-name" required>

        <label for="register-email">Email</label>
        <input type="email" id="register-email" required>

        <label for="register-password">Password</label>
        <input type="password" id="register-password" required>

        <label for="register-department">Department</label>
        <input type="text" id="register-department">

        <button type="submit">Register</button>
    </form>

    <p style="text-align: center; margin-top: 16px; font-size: 13px;">
        <a href="#" id="toggle-link" style="color: #bc002d;">Need an account? Register</a>
    </p>

</div>

<script src="js/api.js"></script>
<script src="js/petals.js"></script>
<script src="js/login.js"></script>
</body>
</html>
